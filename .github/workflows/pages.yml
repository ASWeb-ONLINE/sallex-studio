name: Check and preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  BASE_PATH: /${{ github.event.repository.name }}/
  PUBLIC_BUILD_SHA: ${{ github.sha }}

jobs:
  check:
    name: Build and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install from lockfile
        run: pnpm install --frozen-lockfile
      - name: Type and template checks
        run: pnpm run check
      - name: Pages metadata (only after the owner enables publication)
        if: vars.PAGES_ENABLED == 'true' && github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build static site
        run: pnpm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser checks
        run: pnpm run test:e2e
      - name: Measure build
        run: pnpm run measure
      - name: Upload only the checked static site
        if: vars.PAGES_ENABLED == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    if: vars.PAGES_ENABLED == 'true' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
